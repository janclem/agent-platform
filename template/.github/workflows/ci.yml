name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform: # required status check: `platform / checks`
    name: platform
    permissions:
      contents: read
    uses: janclem/agent-platform/.github/workflows/checks.yml@31dbace4291f6480cecfe849ac8dd4f0bf871c92 # v1.3.1
