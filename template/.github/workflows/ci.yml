name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform: # required status check: `platform / checks`
    name: platform
    permissions:
      contents: read
    uses: janclem/agent-platform/.github/workflows/checks.yml@eb2d552059980881ed71ba1d71acc96af0b4d51d # v1.3.4
