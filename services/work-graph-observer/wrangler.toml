# Adapted from Robbie-Palmer/hq (workers/work-graph-observer/wrangler.toml), AGPL-3.0.
# The Work Graph's only public ingress (ADR 19). Terraform owns the service name,
# hostname and queues; this file owns the code, queue consumer and cron.
name = "work-graph-observer"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

# Reconcile missed deliveries every six hours.
[triggers]
crons = ["17 */6 * * *"]

[[queues.producers]]
binding = "DELIVERIES"
queue = "work-graph-github-deliveries"

[[queues.consumers]]
queue = "work-graph-github-deliveries"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 300
dead_letter_queue = "work-graph-github-deliveries-dlq"
max_concurrency = 1

# The deploy helper replaces this valid but nonexistent sentinel with the
# Terraform-managed Hyperdrive ID in a private temporary copy.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
