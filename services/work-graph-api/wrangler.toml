# Adapted from Robbie-Palmer/hq (workers/work-graph-api/wrangler.toml), AGPL-3.0.
name = "work-graph-api"
main = "src/index.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[version_metadata]
binding = "WORKER_VERSION"

[placement]
mode = "smart"

# Runs on the Workers Free plan until requests exceed its 10 ms CPU allowance
# (ADR 22). Custom CPU limits need Workers Paid, so restore an explicit
# `[limits] cpu_ms` ceiling when upgrading.

# The deploy helper replaces this valid but nonexistent sentinel with the
# Terraform-managed Hyperdrive ID in a private temporary copy.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
