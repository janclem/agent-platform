[tools]
age = "1.3.2"
doppler = "3.77.1"
gitleaks = "8.30.1"
jactionlint = "2.5.0"
node = "26.13.0"
"github:oasdiff/oasdiff" = "1.37.0"
"pipx:copier" = "9.19.1"
pnpm = "12.18.0"
shellcheck = "0.11.0"
sops = "3.13.3"
terraform = "1.17.1"
uv = "0.13.7"
zizmor = "1.32.0"

[tasks.ci]
description = "Repo-specific checks run by the platform checks workflow"
depends = ["ts:check", "work-graph:db", "work-graph:api", "work-graph-infra:check"]
run = "scripts/test-template.sh"

[tasks."ts:install"]
description = "Install the TypeScript workspace from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."ts:check"]
description = "Lint, typecheck and test every TypeScript package"
depends = ["ts:install"]
run = ["pnpm lint", "pnpm typecheck", "pnpm test"]

[tasks."work-graph:db"]
description = "Check Work Graph migrations and run its integration tests against disposable PostgreSQL"
depends = ["ts:install"]
dir = "packages/work-graph-db"
run = ["pnpm db:check", "pnpm test:integration"]

[tasks."work-graph:api"]
description = "Check the Work Graph API contract, CLI build, Worker runtime, and HTTP integration tests"
depends = ["ts:install"]
run = [
  "pnpm --filter work-graph-api lint:api",
  "scripts/check-openapi-breaking.sh services/work-graph-api/openapi.json",
  "pnpm --filter work-graph-cli openapi:check",
  "pnpm --filter work-graph-cli build:check",
  "pnpm --filter work-graph-cli pack:check",
  "pnpm --filter work-graph-api smoke:local-runtime",
  "services/work-graph-api/scripts/deploy.sh --dry-run",
  "pnpm --filter work-graph-api test:integration",
]

[tasks."work-graph-cli:install"]
description = "Build and globally install the work-graph CLI from this checkout"
depends = ["ts:install"]
run = "scripts/install-work-graph-cli.sh"

[tasks."work-graph-infra:check"]
description = "Check that Work Graph Terraform keeps generated credentials out of configuration"
run = "infra/work-graph/scripts/check-security-boundary.sh"

[tasks."work-graph-infra:init"]
description = "Initialize Work Graph Terraform against its HCP workspace"
dir = "infra/work-graph"
run = "scripts/op-terraform-env.sh terraform init -input=false"

[tasks."work-graph-infra:plan"]
description = "Plan Work Graph infrastructure into infra/work-graph/.planfile"
depends = ["work-graph-infra:init"]
dir = "infra/work-graph"
run = "scripts/op-terraform-env.sh terraform plan -input=false -out .planfile"

[tasks."work-graph-infra:apply"]
description = "Apply the reviewed Work Graph plan, then assert state holds no credentials"
depends = ["work-graph-infra:init"]
dir = "infra/work-graph"
run = [
  "scripts/op-terraform-env.sh terraform apply -input=false .planfile",
  "rm -f .planfile",
  "scripts/op-terraform-env.sh scripts/check-state-for-credentials.sh",
]

[tasks."work-graph-infra:state-check"]
description = "Assert that Work Graph Terraform state contains no credentials"
depends = ["work-graph-infra:init"]
dir = "infra/work-graph"
run = "scripts/op-terraform-env.sh scripts/check-state-for-credentials.sh"

[tasks."work-graph:migrate"]
description = "Apply Work Graph migrations to production Neon with DATABASE_URL from Doppler"
depends = ["ts:install"]
dir = "packages/work-graph-db"
run = "doppler run --project work-graph --config prd_work_graph --only-secrets DATABASE_URL -- pnpm db:migrate"

[tasks."work-graph:deploy"]
description = "Deploy the Work Graph Worker (deploy token and Hyperdrive ID from Doppler)"
depends = ["ts:install"]
run = "services/work-graph-api/scripts/deploy.sh"

[tasks."work-graph:smoke-production"]
description = "Check production Access and queue reads with the agents' service token"
run = "services/work-graph-api/scripts/smoke-production.sh"
