name: Validate Renovate config
description: Validate renovate.json and default.json with renovate-config-validator (skips when absent)

runs:
  using: composite
  steps:
    - name: Validate Renovate config
      shell: bash
      env:
        RENOVATE_IMAGE: renovate/renovate:44.221.0@sha256:fc9d9ea902fa0f3892e0a6e0e4924b04e80becc3d475d8b14849b0e39b81c409
      run: ${{ github.action_path }}/renovate-validate.sh
