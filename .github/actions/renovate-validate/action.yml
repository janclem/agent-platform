name: Validate Renovate config
description: Validate renovate.json and default.json with renovate-config-validator (skips when absent)

runs:
  using: composite
  steps:
    - name: Validate Renovate config
      shell: bash
      env:
        RENOVATE_IMAGE: renovate/renovate:44.216.4@sha256:a8279e2292a674638d8a08ec78bc5864b1397d4e8e400745ad0b7b910c532c77
      run: ${{ github.action_path }}/renovate-validate.sh
