name: Validate Renovate config
description: Validate renovate.json and default.json with renovate-config-validator (skips when absent)

runs:
  using: composite
  steps:
    - name: Validate Renovate config
      shell: bash
      env:
        RENOVATE_IMAGE: renovate/renovate:44.223.1@sha256:4d82316637556d793f1c0e248e003a3842ebadecea0a9f4e9b77c12421da2122
      run: ${{ github.action_path }}/renovate-validate.sh
