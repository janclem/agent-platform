name: Validate Renovate config
description: Validate renovate.json and default.json with renovate-config-validator (skips when absent)

runs:
  using: composite
  steps:
    - name: Validate Renovate config
      shell: bash
      env:
        RENOVATE_IMAGE: renovate/renovate:44.221.2@sha256:e1f87f7fc3f32422d9bb88ff003edd6472f00b6b8ba0b8e413851c3b8ee2df95
      run: ${{ github.action_path }}/renovate-validate.sh
