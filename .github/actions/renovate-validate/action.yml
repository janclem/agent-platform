name: Validate Renovate config
description: Validate renovate.json and default.json with renovate-config-validator (skips when absent)

runs:
  using: composite
  steps:
    - name: Validate Renovate config
      shell: bash
      env:
        RENOVATE_IMAGE: renovate/renovate:44.218.0@sha256:875552f7f3de9d41f43fa2cf0a9d2f18b1be59672516b8b4d530b99e696db389
      run: ${{ github.action_path }}/renovate-validate.sh
