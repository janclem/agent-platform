name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 3" # weekly full scan, Wednesday 00:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: security
    permissions:
      contents: read
      security-events: write
    uses: $/.github/workflows/scans.yml
