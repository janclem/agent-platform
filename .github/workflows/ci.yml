name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  # Superseded PR runs are cancelled. Each main commit gets its own group, because
  # a shared group would still drop superseded pending runs, and each commit
  # records its own delivery signal.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  platform:
    name: platform
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yml

  homelab:
    name: homelab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check formatting and evaluate hosts
        run: homelab/scripts/check.sh

  # Delivery signal for platform changes (delivery contract: "the merged main run
  # of platform / checks passed"). The environment's successful deployment is the
  # evidence the Work Graph observer records for this commit.
  record-main:
    name: record-main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [platform, homelab]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-agent-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools pinned in mise.toml
        uses: $/.github/actions/setup-mise
        with:
          tools: node pnpm

      # A passing commit also delivers earlier platform commits whose checks
      # failed or never ran; record those so their tickets can complete.
      - name: Record earlier commits this run delivered
        run: mise run work-graph:record-covered-deployments production-agent-platform
        env:
          GH_TOKEN: ${{ github.token }}
