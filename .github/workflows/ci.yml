name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit finishes, so each one can
  # record its delivery signal.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  platform:
    name: platform
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yml

  homelab:
    name: homelab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check formatting and evaluate hosts
        run: homelab/scripts/check.sh

  # Delivery signal for platform changes (delivery contract: "the merged main run
  # of platform / checks passed"). The environment's successful deployment is the
  # evidence the Work Graph observer records for this commit.
  record-main:
    name: record-main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [platform, homelab]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: production-agent-platform
    steps:
      - name: Record that main passed its checks
        run: echo "main passed platform and homelab checks"
