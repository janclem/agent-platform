# Adapted from Robbie-Palmer/hq (.github/workflows/work-graph-api-cd.yml), AGPL-3.0.
# Migrates, deploys and smoke-tests the Work Graph API, then deploys the GitHub
# observer, on every merge to main. The environment holds one secret, a
# read-only Doppler service token for work-graph/prd_work_graph (ADR 23); each
# task reads only the values it needs.

name: Work Graph CD

on:
  push:
    branches:
      - main
    paths:
      - "packages/drizzle-tooling/**"
      - "packages/github-client/**"
      - "packages/ts-base/**"
      - "packages/work-graph-cli/**"
      - "packages/work-graph-db/**"
      - "packages/work-graph-domain/**"
      - "services/work-graph-api/**"
      - "services/work-graph-observer/**"
      - ".work-graph/delivery-targets.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/work-graph-cd.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: work-graph-production
  # Finish the active migration and deploy; keep only the newest pending run.
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: production-work-graph
      url: https://work-graph.clemetson.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for recording the earlier commits this run delivers.
          fetch-depth: 0

      - name: Install tools pinned in mise.toml
        uses: $/.github/actions/setup-mise

      - name: Apply Work Graph migrations
        run: mise run work-graph:migrate
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Deploy Worker
        run: mise run work-graph:deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Smoke-test Access and queue
        run: mise run work-graph:smoke-production
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      # After the migration, so the consumer never writes to an older schema.
      - name: Deploy GitHub observer
        run: mise run work-graph:observer-deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      # Completion evaluation uses the stored catalog; publishing it here means a
      # change applies on merge instead of at the next six-hourly reconciliation.
      - name: Publish delivery targets
        run: mise run work-graph:publish-delivery-targets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      # Superseded queued runs never deploy their own commit; this run delivered
      # them, so record that and let their tickets complete.
      - name: Record earlier commits this run delivered
        run: mise run work-graph:record-covered-deployments production-work-graph
        env:
          GH_TOKEN: ${{ github.token }}
