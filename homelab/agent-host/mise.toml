# Global tools for the agent user on agent hosts (ADR 25), installed as that
# user's ~/.config/mise/config.toml. Renovate bumps them like any mise file.
# A T3 Code client refuses a server of another protocol version, so move the
# owner's T3 Code client to the same `t3` version when this pin changes.
[tools]
node = "26.13.0"
"npm:t3" = "0.1.9"
# Claude Code's npm package fetches its native binary in a postinstall step that
# mise skips; the aqua backend installs that binary directly.
"aqua:anthropics/claude-code" = "2.1.311"
"npm:@openai/codex" = "0.169.0"
# For the work-graph CLI, through WORK_GRAPH_DOPPLER_BIN; matches the repository pin.
doppler = "3.77.1"

[settings]
# mise compiles from source on NixOS unless told otherwise; agent hosts run
# prebuilt binaries through nix-ld.
all_compile = false
